<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Récupération - Téléphones du Monde</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-slate-800 flex flex-col min-h-full">

  <!-- Header -->
  <header class="bg-white shadow-sm p-4 flex flex-col sm:flex-row justify-between items-center gap-3">
    <h1 class="text-2xl font-bold text-sky-700">Téléphones du Monde 🌍</h1>
    <nav class="flex flex-wrap justify-center space-x-4 text-sky-600 font-medium items-center">
      <a href="Accueil-phone.html" class="hover:text-sky-800 transition">Accueil</a>
      <a href="catalogue.html" class="hover:text-sky-800 transition">Catalogue</a>
      <a href="login.html" class="hover:text-sky-800 transition font-bold border border-sky-600 text-sky-600 hover:bg-sky-600 hover:text-white py-1 px-3 rounded-lg">
        Connexion
      </a>
    </nav>
  </header>

  <!-- Récupération -->
  <section id="recover" class="flex justify-center items-center py-12 bg-gradient-to-r from-blue-900 to-violet-700 flex-grow px-4">
    <div class="bg-white shadow-xl rounded-xl p-8 w-full max-w-md animate-fadeIn">
      <h2 class="text-2xl font-bold text-center text-sky-700 mb-2">Récupération de compte 🔄</h2>
      <p class="text-center text-sm text-gray-500 mb-6">Choisissez votre méthode de réinitialisation :</p>
      
      <!-- Récupération par email -->
      <form id="recoverEmailForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Par adresse Email</label>
          <input type="email" placeholder="exemple@email.com" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-sky-600 text-white py-2.5 rounded-lg font-bold hover:bg-sky-500 transition shadow-md">
          Envoyer le lien de réinitialisation 📧
        </button>
      </form>

      <!-- Séparateur visuel -->
      <div class="relative my-6 text-center">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
        <span class="relative bg-white px-3 text-xs text-gray-400 font-semibold uppercase">ou</span>
      </div>

      <!-- Récupération par numéro -->
      <form id="recoverPhoneForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Par numéro de téléphone</label>
          <input type="tel" placeholder="+229 XX XX XX XX" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-violet-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-violet-600 text-white py-2.5 rounded-lg font-bold hover:bg-violet-500 transition shadow-md">
          Envoyer le code OTP 📱
        </button>
      </form>

      <div class="mt-6 text-center text-sm">
        <a href="login.html" class="text-sky-600 hover:underline font-medium">← Retour à la connexion</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-gradient-to-r from-blue-900 to-violet-700 text-white text-center p-6">
    <p>© 2026 Téléphones du Monde</p>
    <p class="text-sm mt-2">Votre partenaire de confiance pour l’achat de téléphones</p>
  </footer>

  <!-- Script dynamique -->
  <script>
  // Configuration de l'URL de ton backend pour Vercel (chemin relatif)
  const API_URL = '/api';

  // Récupération Email
  document.getElementById('recoverEmailForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = e.target.querySelector('input').value;

    try {
      const response = await fetch(`${API_URL}/recover-email`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      
      const data = await response.json();
      alert(data.message);
    } catch (err) {
      console.warn("Erreur de connexion au serveur :", err);
    }
  });

  // Récupération Téléphone
  document.getElementById('recoverPhoneForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const phone = e.target.querySelector('input').value;

    try {
      const response = await fetch(`${API_URL}/recover-phone`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone })
      });
      
      const data = await response.json();
      alert(data.message);
    } catch (err) {
      console.warn("Erreur de connexion au serveur :", err);
    }
  });
</script>
</body>
</html>
