<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Téléphone - Téléphones du Monde</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4 sm:p-6 min-h-full flex flex-col items-center justify-center">
    
    <div class="max-w-3xl w-full mx-auto bg-white rounded-3xl shadow-lg border border-slate-100 p-6 sm:p-8" id="productDetails">
        <div class="flex flex-col items-center justify-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-sky-600 mb-4"></div>
            <p class="text-center text-slate-500 font-medium">Chargement des détails...</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        async function loadDetails() {
            const container = document.getElementById('productDetails');
            
            try {
                const res = await fetch('/api/products');
                if (!res.ok) throw new Error("Erreur serveur");
                
                const products = await res.json();
                const product = products.find(p => p.id == productId);

                if (!product) {
                    container.innerHTML = `
                        <div class="text-center py-10">
                            <span class="text-5xl block mb-4">🕵️‍♂️</span>
                            <p class="text-red-500 font-bold text-xl mb-4">Téléphone introuvable.</p>
                            <a href="/catalogue" class="text-sky-600 font-medium hover:underline">Retourner au catalogue</a>
                        </div>`;
                    return;
                }

                // Sécurisation des données (pour éviter les affichages "undefined")
                const imageSrc = product.image_url || product.photo_url || '';
                const isValidImg = imageSrc && imageSrc.trim() !== '' && !imageSrc.toLowerCase().includes('photo');
                const brand = product.brand || product.marque || 'Marque';
                const name = product.name || product.nom || 'Téléphone';
                const price = product.price_usd || product.prix || product.price || 0;
                
                // Éviter d'écrire "Apple Apple iPhone"
                const displayName = name.toLowerCase().startsWith(brand.toLowerCase()) ? name : `${brand} ${name}`;

                // Message WhatsApp pré-rempli
                const whatsappMsg = encodeURIComponent(`Bonjour, je suis intéressé(e) par la fiche de ce téléphone : ${displayName} à ${price} $. Est-il disponible ?`);

                container.innerHTML = `
                    <!-- Gestion de l'image ou de l'émoji par défaut -->
                    <div class="w-full h-64 sm:h-80 bg-slate-100 rounded-2xl mb-6 relative overflow-hidden flex items-center justify-center shadow-inner">
                        ${isValidImg 
                          ? `<img src="/${imageSrc}" alt="${displayName}" class="w-full h-full object-cover" onerror="this.outerHTML='<div class=\\'text-7xl text-sky-700\\'>📱</div>'">` 
                          : `<div class="text-7xl text-sky-700">📱</div>`}
                        <span class="absolute top-4 left-4 bg-white/90 backdrop-blur-sm text-sky-700 text-xs font-black px-3 py-1.5 rounded-full shadow-sm uppercase tracking-wider">
                            ${brand}
                        </span>
                    </div>

                    <!-- En-tête : Titre et Prix -->
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-100 pb-6">
                        <div>
                            <h1 class="text-2xl sm:text-3xl font-black text-slate-900">${displayName}</h1>
                            <p class="text-sm text-slate-500 mt-1">${product.specs || 'Modèle standard'}</p>
                        </div>
                        <div class="text-2xl font-black text-emerald-600 bg-emerald-50 px-4 py-2 rounded-xl border border-emerald-100 shrink-0">
                            ${price} $
                        </div>
                    </div>
                    
                    <!-- Fiche technique avec valeurs par défaut -->
                    <div class="mt-6">
                        <h3 class="font-bold text-slate-800 mb-4 text-lg">Fiche Technique Complète</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm text-slate-700">
                            <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100">
                                <span class="text-xl">📱</span> 
                                <div><span class="block text-xs text-slate-400 font-bold uppercase">Écran</span> ${product.ecran || 'Non spécifié'}</div>
                            </div>
                            <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100">
                                <span class="text-xl">📸</span> 
                                <div><span class="block text-xs text-slate-400 font-bold uppercase">Caméra</span> ${product.camera || 'Non spécifié'}</div>
                            </div>
                            <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100">
                                <span class="text-xl">🔋</span> 
                                <div><span class="block text-xs text-slate-400 font-bold uppercase">Batterie</span> ${product.batterie || 'Non spécifié'}</div>
                            </div>
                            <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100">
                                <span class="text-xl">💾</span> 
                                <div><span class="block text-xs text-slate-400 font-bold uppercase">Stockage</span> ${product.stockage || 'Non spécifié'}</div>
                            </div>
                            <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100">
                                <span class="text-xl">⚡</span> 
                                <div><span class="block text-xs text-slate-400 font-bold uppercase">RAM</span> ${product.ram || 'Non spécifié'}</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Boutons d'action -->
                    <div class="mt-8 flex flex-col sm:flex-row gap-3">
                        <button onclick="window.history.back()" class="flex-1 text-center bg-white border-2 border-slate-200 text-slate-700 font-bold py-3 rounded-xl hover:bg-slate-50 hover:border-slate-300 transition flex items-center justify-center gap-2">
                            ⬅ Retour
                        </button>
                        <a href="https://wa.me/22900000000?text=${whatsappMsg}" target="_blank" class="flex-1 text-center bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-500 transition shadow-lg flex items-center justify-center gap-2">
                            💬 Contacter le vendeur
                        </a>
                    </div>
                `;
            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="text-center py-8"><p class="text-red-500 font-bold">Erreur de chargement des données. Veuillez réessayer.</p></div>`;
            }
        }
        
        loadDetails();
    </script>
</body>
</html>
