<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Téléphones du Monde</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chemin CSS corrigé -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-50 text-slate-800 flex flex-col min-h-full">

  <!-- Header -->
  <header class="bg-white shadow-sm p-4 flex flex-col sm:flex-row justify-between items-center gap-3">
    <h1 class="text-2xl font-bold text-sky-700">Téléphones du Monde 🌍</h1>
    <nav class="flex flex-wrap justify-center space-x-4 text-sky-600 font-medium items-center">
      <!-- Liens nettoyés (sans .html) -->
      <a href="/" class="hover:text-sky-800 transition">Accueil</a>
      <a href="/catalogue" class="hover:text-sky-800 transition">Catalogue</a>
      <a href="/auth" class="hover:text-sky-800 transition">Récupération</a>
      <a href="/register" class="bg-sky-600 text-white px-3 py-1.5 rounded-lg hover:bg-sky-500 transition font-bold">
        Inscription
      </a>
    </nav>
  </header>

  <!-- Section Connexion -->
  <section class="flex justify-center items-center py-12 bg-gradient-to-r from-blue-900 to-violet-700 flex-grow px-4">
    <div class="bg-white shadow-xl rounded-xl p-8 w-full max-w-md animate-fadeIn">
      <h2 class="text-2xl font-bold text-center text-sky-700 mb-6">Connexion 🔑</h2>
      
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Vous êtes ?</label>
          <select id="userRoleSelect" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-violet-500 focus:outline-none bg-gray-50 font-medium">
            <option value="client">Client / Acheteur 🛒</option>
            <option value="vendeur">Vendeur / Boutique 🏪</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Adresse Email</label>
          <input type="email" id="email" placeholder="exemple@email.com" required
                 class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-violet-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" required
                 class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-violet-500 focus:outline-none">
        </div>

        <div class="text-right">
          <!-- Lien corrigé -->
          <a href="/auth" class="text-xs text-sky-600 hover:underline font-medium">Mot de passe oublié ?</a>
        </div>

        <button type="submit"
                class="w-full bg-violet-600 text-white py-2.5 rounded-lg font-bold hover:bg-violet-500 transition shadow-md">
          Se connecter
        </button>
      </form>

      <p class="text-center text-sm text-gray-600 mt-6">
        Pas encore de compte ? <a href="/register" class="text-sky-600 font-semibold hover:text-violet-600 transition">Inscrivez‑vous</a>
      </p>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-gradient-to-r from-blue-900 to-violet-700 text-white text-center p-6">
    <p>© 2026 Téléphones du Monde</p>
    <p class="text-sm mt-2">Votre partenaire de confiance pour l’achat de téléphones</p>
  </footer>

  <!-- Script JS Connexion -->
  <script>
    document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();

      const role = document.getElementById('userRoleSelect').value;
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Connexion en cours...';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role })
        });

        const data = await response.json();

        if (response.ok) {
          const userRole = data.role || role;
          localStorage.setItem('userRole', userRole);
          localStorage.setItem('userEmail', email);
          if (data.user_id || data.id) localStorage.setItem('userId', data.user_id || data.id);
          if (data.token) localStorage.setItem('authToken', data.token);
          if (data.nom || data.prenom) localStorage.setItem('userName', `${data.prenom || ''} ${data.nom || ''}`.trim());

          // Redirection corrigée vers les routes Flask sans .html
          if (userRole === 'vendeur') {
            window.location.href = '/page-vendeur';
          } else {
            window.location.href = '/catalogue';
          }
        } else {
          alert(data.message || 'Identifiants ou rôle incorrects.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Se connecter';
        }
      } catch (error) {
        console.error('Erreur :', error);
        alert('Impossible de contacter le serveur Flask. Vérifiez qu\'il est bien lancé.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Se connecter';
      }
    });
  </script>
</body>
</html>
